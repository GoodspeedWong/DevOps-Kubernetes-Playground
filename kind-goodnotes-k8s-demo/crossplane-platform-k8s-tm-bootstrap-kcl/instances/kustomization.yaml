# Add one file per TM bootstrap KCL instance here.
# To create a new instance:
# 1. Copy an existing instance YAML in this directory.
# 2. Change metadata.name and spec.parameters values.
# 3. Keep spec.crossplane.compositionRef.name pinned to the KCL composition.
# 4. Add the new filename to resources below.
resources:
  - tm-bootstrap-kcl.yaml
